<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate YouTube Script Rewriter - Unlimited Length</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
    color: #f1f1f1;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  
  .header {
    text-align: center;
    margin-bottom: 40px;
    padding: 20px;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff0000, #ff6b6b);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 25px;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(255,0,0,0.3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  
  .header h1 {
    font-size: 2.8rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff0000, #ff6b6b, #ffd700, #ff6b6b, #ff0000);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 3s ease infinite;
    margin: 20px 0;
  }
  @keyframes gradient {
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  
  .header p { color: #aaa; font-size: 1.1rem; margin-bottom: 10px; }
  .features { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
  .feature { 
    background: rgba(255,255,255,0.05); 
    padding: 8px 16px; 
    border-radius: 20px; 
    font-size: 0.85rem; 
    border: 1px solid rgba(255,0,0,0.2);
  }

  .card {
    background: rgba(26,26,26,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,0,0,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }
  .card:hover { border-color: rgba(255,0,0,0.3); transform: translateY(-5px); }

  .form-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 300px; }
  
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 700;
    color: #ff6b6b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  
  textarea, input {
    width: 100%;
    background: rgba(17,17,17,0.8);
    border: 2px solid rgba(51,51,51,0.8);
    border-radius: 12px;
    color: #f1f1f1;
    font-size: 1rem;
    line-height: 1.6;
    padding: 16px;
    resize: vertical;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  textarea:focus, input:focus { 
    border-color: #ff0000; 
    box-shadow: 0 0 20px rgba(255,0,0,0.2);
    background: rgba(17,17,17,0.95);
  }
  
  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff0000, #cc0000, #ff6b6b);
    color: #fff;
    font-size: 1.2rem;
    box-shadow: 0 10px 30px rgba(255,0,0,0.4);
  }
  .btn-primary:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 20px 40px rgba(255,0,0,0.5);
  }
  .btn-primary:active { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .progress-bar {
    width: 100%; height: 8px; background: rgba(51,51,51,0.8);
    border-radius: 4px; overflow: hidden; margin: 20px 0;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #ff0000, #ffd700);
    width: 0%; transition: width 0.3s ease;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
  }

  .output-box {
    background: rgba(17,17,17,0.95);
    border: 2px solid rgba(42,42,42,0.8);
    border-radius: 12px;
    padding: 25px;
    font-size: 1rem;
    line-height: 1.8;
    color: #f1f1f1;
    white-space: pre-line;
    min-height: 120px;
    max-height: 60vh;
    overflow-y: auto;
    position: relative;
  }
  .word-count { 
    position: absolute; top: 15px; right: 20px;
    background: rgba(255,0,0,0.2); padding: 5px 12px;
    border-radius: 20px; font-size: 0.85rem; font-weight: 700;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin: 25px 0;
  }
  .stat-card {
    background: linear-gradient(135deg, rgba(255,0,0,0.1), rgba(255,107,107,0.1));
    border: 1px solid rgba(255,0,0,0.2);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
  }
  .stat-card:hover { transform: scale(1.02); }
  .stat-value { font-size: 2rem; font-weight: 900; color: #ffd700; display: block; }
  .stat-label { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

  .loader {
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; color: #ff6b6b; font-size: 1.1rem; font-weight: 700;
    padding: 40px 20px;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(255,0,0,0.1);
    border-top: 4px solid #ff0000;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .chunk-status {
    display: flex; gap: 10px; font-size: 0.9rem; color: #aaa;
    margin-top: 15px; flex-wrap: wrap;
  }
  .chunk { 
    background: rgba(255,107,107,0.2); 
    padding: 4px 10px; border-radius: 15px; 
  }
  .chunk.done { background: rgba(76,175,80,0.3); }

  @media (max-width: 768px) {
    .form-row { flex-direction: column; }
    .header h1 { font-size: 2.2rem; }
    .container { padding: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">🚀 UNLIMITED LENGTH</div>
    <h1>Ultimate Script Rewriter</h1>
    <p>Rewrite <strong>10,000+ word scripts</strong> in seconds. Perfect for long-form YouTube, TikTok, podcasts</p>
    <div class="features">
      <div class="feature">✅ Unlimited Words</div>
      <div class="feature">✅ Exact Sentence Match</div>
      <div class="feature">✅ 100% Original</div>
      <div class="feature">✅ YouTube Voice</div>
      <div class="feature">✅ Chunk Processing</div>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="form-row">
      <div class="form-group">
        <label>🔑 Anthropic API Key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-... (get at console.anthropic.com)">
        <small style="color:#888; font-size:0.8rem; display:block; margin-top:5px;">
          Free $5-20 credits • No card needed
        </small>
      </div>
      <div class="form-group">
        <label>🎯 Voice Style</label>
        <select id="voiceStyle" style="height:100%;">
          <option>High-Energy YouTube (Default)</option>
          <option>Storytelling & Narrative</option>
          <option>Casual Conversational</option>
          <option>Professional Authority</option>
          <option>Clickbait Hooks Heavy</option>
        </select>
      </div>
    </div>
    
    <label>📋 Paste Your Full Script (Unlimited Length)</label>
    <textarea id="inputText" rows="12" placeholder="Paste your entire script here... 10K+ words supported!"></textarea>
    
    <button class="btn btn-primary" id="rewriteBtn" onclick="rewriteScript()">
      🔥 REWRITE FULL SCRIPT
    </button>
  </div>

  <!-- Output Card -->
  <div class="card" id="outputCard" style="display:none;">
    <label>✅ Your Rewritten Script</label>
    <div class="word-count" id="outputWordCount">-</div>
    <div class="output-box" id="outputText"></div>
    
    <div class="progress-bar" id="progressBar" style="display:none;">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="stats-grid" id="statsGrid"></div>
    
    <div style="display:flex; gap:15px;">
      <button class="btn btn-primary" onclick="copyOutput()" style="flex:1;">📋 Copy Full Script</button>
      <button class="btn" onclick="downloadScript()" style="flex:1; background:#2a2a2a; border:1px solid #444;">💾 Download .txt</button>
    </div>
  </div>
</div>

<script>
let isProcessing = false;
let currentChunks = [];

async function rewriteScript() {
  const input = document.getElementById('inputText').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  
  if (!input) return alert('Paste your script first! 🚀');
  if (!apiKey) return alert('Enter your Anthropic API key! 🔑\nGet it free at console.anthropic.com');
  
  isProcessing = true;
  const btn = document.getElementById('rewriteBtn');
  btn.disabled = true;
  btn.innerHTML = '⏳ PROCESSING...';

  const outputCard = document.getElementById('outputCard');
  outputCard.style.display = 'block';
  
  try {
    // Split into chunks for unlimited length
    const chunks = splitIntoChunks(input);
    currentChunks = chunks;
    
    document.getElementById('outputText').innerHTML = `
      <div class="loader">
        <div class="spinner"></div>
        <div>Splitting into ${chunks.length} chunks...</div>
        <div class="chunk-status" id="chunkStatus"></div>
      </div>
    `;
    
    const results = await processChunks(chunks, apiKey);
    const finalOutput = results.join('\n\n');
    
    displayResult(finalOutput, input);
    
  } catch(e) {
    console.error(e);
    document.getElementById('outputText').textContent = 
      `❌ Error: ${e.message}\n\nTry again or check your API key.`;
  }
  
  isProcessing = false;
  btn.disabled = false;
  btn.innerHTML = '🔥 REWRITE FULL SCRIPT';
}

function splitIntoChunks(text, maxWordsPerChunk = 1200) {
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
  const chunks = [];
  let currentChunk = [];
  let currentWords = 0;
  
  for (let sentence of sentences) {
    const words = sentence.trim().split(/\s+/).length;
    
    if (currentWords + words > maxWordsPerChunk && currentChunk.length > 0) {
      chunks.push(currentChunk.join(' '));
      currentChunk = [sentence];
      currentWords = words;
    } else {
      currentChunk.push(sentence);
      currentWords += words;
    }
  }
  
  if (currentChunk.length > 0) {
    chunks.push(currentChunk.join(' '));
  }
  
  return chunks;
}

async function processChunks(chunks, apiKey) {
  const results = [];
  
  for (let i = 0; i < chunks.length; i++) {
    updateProgress(i, chunks.length);
    const result = await processChunk(chunks[i], apiKey, i + 1, chunks.length);
    results.push(result);
    
    // Update chunk status
    document.getElementById('chunkStatus').innerHTML += 
      `<span class="chunk done">Chunk ${i+1}/${chunks.length}</span>`;
  }
  
  return results;
}

async function processChunk(chunk, apiKey, chunkNum, totalChunks) {
  const voiceStyle = document.getElementById('voiceStyle').value;
  
  const systemPrompt = `You are an expert YouTube script rewriter. Transform content into high-energy, engaging scripts.

CRITICAL RULES:
1. PRESERVE EXACT sentence structure & count from this chunk
2. 100% ORIGINAL wording - rewrite every sentence completely
3. Match the selected voice: ${voiceStyle}
4. High-energy YouTube style: hooks, questions, urgency
5. Keep ALL facts, names, dates, numbers exactly
6. Punchy sentences, conversational flow
7. Output ONLY rewritten text - no explanations

Format: Each sentence on new line. No blank lines.`;

  const userPrompt = `Rewrite this script chunk (${chunkNum}/${totalChunks}):\n\n${chunk}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({
      model: "claude-3-5-sonnet-20241022",
      max_tokens: 4000,
      temperature: 0.7,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }]
    })
  });

  if (!response.ok) {
    const error = await response.json();
    throw new Error(`API Error ${response.status}: ${error.error?.message || 'Unknown error'}`);
  }

  const data = await response.json();
  return data.content[0].text.trim();
}

function updateProgress(current, total) {
  const progress = (current / total) * 100;
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('progressFill').style.width = `${progress}%`;
}

function displayResult(output, original) {
  document.getElementById('outputText').textContent = output;
  document.getElementById('outputWordCount').textContent = 
    `${countWords(output)} words • ${Math.round((countWords(output)/countWords(original))*100)}% length`;
  
  const origSentences = countSentences(original);
  const newSentences = countSentences(output);
  
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <span class="stat-value">${countWords(original)}</span>
      <div>Original Words</div>
    </div>
    <div class="stat-card">
      <span class="stat-value">${countWords(output)}</span>
      <div>Rewritten Words</div>
    </div>
    <div class="stat-card">
      <span class="stat-value">${origSentences}</span>
      <div>Original Sentences</div>
    </div>
    <div class="stat-card">
      <span class="stat-value">${newSentences}</span>
      <div>Rewritten Sentences</div>
    </div>
    <div class="stat-card">
      <span class="stat-value">${Math.round((newSentences/origSentences)*100)}%</span>
      <div>Sentence Match</div>
    </div>
  `;
}

function countWords(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function countSentences(text) {
  return (text.match(/[^.!?]*[.!?]+/g) || []).length;
}

function copyOutput() {
  const text = document.getElementById('outputText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const original = btn.textContent;
    btn.textContent = '✅ COPIED!';
    btn.style.background = '#4caf50';
    setTimeout(() => {
      btn.textContent = original;
      btn.style.background = '';
    }, 2000);
  });
}

function downloadScript() {
  const text = document.getElementById('outputText').textContent;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rewritten-script-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// Real-time word counter
document.getElementById('inputText').addEventListener('input', function() {
  const words = countWords(this.value);
  const label = this.parentNode.querySelector('label');
  label.innerHTML += ` <span style="color:#ffd700;float:right;font-size:0.9rem;font-weight:700">📊 ${words} words</span>`;
});
</script>
</body>
</html>
